name: Coverage Badge

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f 3_1_LLM_agent/requirements.txt ]; then
            pip install -r 3_1_LLM_agent/requirements.txt
          fi

          pip install pytest pytest-cov pytest-mock python-decouple requests duckduckgo-search

      - name: Run tests and calculate coverage
        working-directory: 3_1_LLM_agent
        run: |
          pytest tests/ -v -m "not integration" \
            --cov=./llm_agent \
            --cov-report=xml \
            --cov-report=term

      - name: Get coverage percentage
        working-directory: 3_1_LLM_agent
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse("coverage.xml").getroot()

          coverage = float(root.attrib["line-rate"]) * 100
          coverage = round(coverage, 1)

          print(f"Coverage: {coverage}%")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"COVERAGE={coverage}%\n")
              f.write(f"COVERAGE_VALUE={coverage}\n")
          PY

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 4e57176b87ec645f4c7b71f6085b36c6
          filename: coverage.json
          label: My Code Coverage
          message: ${{ env.COVERAGE }}
          valColorRange: ${{ env.COVERAGE_VALUE }}
          maxColorRange: 90
          minColorRange: 50
