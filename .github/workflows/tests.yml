name: Python Tests and Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov requests
        if [ -f 3_1_LLM_agent/requirements.txt ]; then pip install -r 3_1_LLM_agent/requirements.txt; fi
    
    - name: Run tests with coverage
      run: |
        cd 3_1_LLM_agent
        python -m pytest tests/test_fallback_model.py -v --cov=llm_agent.fallback_model --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./3_1_LLM_agent/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
    
    - name: Start Ollama
      run: |
        ollama serve &
        sleep 10
    
    - name: Pull model
      run: |
        ollama pull qwen2.5:0.5b
    
    - name: Run integration test
      run: |
        cd 3_1_LLM_agent
        python test_my_model.py
        