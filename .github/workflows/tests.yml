name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        
    - name: Start Ollama service
      run: |
        ollama serve > ollama.log 2>&1 &
        sleep 10
        
    - name: Pull tiny model for CI
      run: |
        ollama pull qwen2.5:0.5b
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov requests
        if [ -f 3_1_LLM_agent/requirements.txt ]; then pip install -r 3_1_LLM_agent/requirements.txt; fi
    
    - name: Run tests with coverage
      run: |
        cd 3_1_LLM_agent
        # Запускаем ТОЛЬКО надежные юнит-тесты логгера
        python -m pytest tests/test_audit_logger.py -v --cov=llm_agent --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./3_1_LLM_agent/coverage.xml
        flags: unittests
        name: codecov-umbrella
