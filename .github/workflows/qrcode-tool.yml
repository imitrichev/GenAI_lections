# Юнит-тесты класса QRCodeTool (лабораторная работа 1, вариант 9)
# и автообновляемый бэйджик покрытия кода.

name: QRCodeTool tests

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      working-directory: ./3_1_LLM_agent
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests with coverage
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_tool_qrcode.py -v \
          -m "not integration" \
          --cov=llm_agent.tool_qrcode \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml

    - name: Code coverage report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: 3_1_LLM_agent/coverage.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'

    - name: Add coverage PR comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Get the coverage
      id: get_coverage
      run: |
        COVVALUE=$(python -c "import xml.etree.ElementTree as ET; \
          print(f\"{float(ET.parse('3_1_LLM_agent/coverage.xml').getroot().get('line-rate')) * 100:.0f}%\")")
        echo "Coverage: $COVVALUE"
        echo "COVERAGE=$COVVALUE" >> $GITHUB_ENV

    - name: Create the badge
      if: github.event_name == 'push' && env.GIST_ID != ''
      env:
        GIST_ID: ${{ secrets.GIST_ID }}
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: ${{ secrets.GIST_ID }}
        filename: GenAI_lections_qrcode_coverage.json
        label: QRCodeTool coverage
        message: ${{ env.COVERAGE }}
        color: green
