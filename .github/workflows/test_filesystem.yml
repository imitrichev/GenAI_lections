name: Test FileSystemTool

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-filesystem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 3_1_LLM_agent/requirements.txt

      - name: Run FileSystemTool tests
        working-directory: 3_1_LLM_agent
        run: |
          python tests/test_filesystem.py