name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock
          pip install python-decouple requests duckduckgo-search
          pip install mutagen

          if [ -f 3_1_LLM_agent/requirements.txt ]; then
            pip install -r 3_1_LLM_agent/requirements.txt
          fi

      - name: Run unit tests
        run: |
          cd 3_1_LLM_agent
          pytest tests/ -v -m "not integration" \
            --cov=./llm_agent \
            --cov-report=term \
            --cov-report=xml

  coverage-badge:
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage-badge
          pip install python-decouple requests duckduckgo-search
          pip install mutagen

          if [ -f 3_1_LLM_agent/requirements.txt ]; then
            pip install -r 3_1_LLM_agent/requirements.txt
          fi

      - name: Run tests and calculate coverage
        run: |
          cd 3_1_LLM_agent
          pytest tests/ -v -m "not integration" --cov=./llm_agent

      - name: Create coverage badge
        run: |
          coverage-badge -o coverage.svg

      - name: Save coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "Update coverage badge [skip ci]"
          git push
