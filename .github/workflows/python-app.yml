name: Python tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3_1_LLM_agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: 3_1_LLM_agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: >-
          python -m pytest -v
          --cov=llm_agent.tool_language_detector
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Generate coverage badge
        run: genbadge coverage -i coverage.xml -o coverage.svg

      - name: Publish coverage badge
        if: >-
          github.repository == 'metablin/GenAI_lections' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp 3_1_LLM_agent/coverage.svg "$RUNNER_TEMP/coverage.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan coverage-badge
          git clean -fdx
          cp "$RUNNER_TEMP/coverage.svg" coverage.svg
          git add coverage.svg
          git commit -m "Update coverage badge"
          git push --force origin HEAD:coverage-badge
