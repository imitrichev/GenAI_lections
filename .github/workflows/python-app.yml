name: Python tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -v
          coverage report -m

      - name: Generate coverage badge
        if: matrix.python-version == '3.11'
        run: |
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $NF}' | tr -d '%')
          echo "Coverage: $COVERAGE%"
          COLOR="red"
          if [ "$COVERAGE" -ge 80 ]; then COLOR="green"; fi
          if [ "$COVERAGE" -ge 60 ] && [ "$COVERAGE" -lt 80 ]; then COLOR="yellow"; fi
          cat > coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="120" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h60v20H0z"/>
              <path fill="$COLOR" d="M60 0h60v20H60z"/>
              <path fill="url(#b)" d="M0 0h120v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="30" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="30" y="14">coverage</text>
              <text x="90" y="15" fill="#010101" fill-opacity=".3">$COVERAGE%</text>
              <text x="90" y="14">$COVERAGE%</text>
            </g>
          </svg>
          EOF

      - name: Commit coverage badge
        if: matrix.python-version == '3.11'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push || echo "No changes to push"