[project]
name = "genai-lections"
version = "0.1.0"
description = "GenAI/LLM course materials"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "decouple>=0.0.7",
    "dotenv>=0.9.9",
    "langdetect>=1.0.9",
    "pydantic>=2.13.5",
    "pyspellchecker>=0.9.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "3_1_LLM_agent"]
