name: Python application CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/python-3.11
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl pytest pytest-cov coverage-badge requests python-decouple

    # Запускаем только юнит-тесты (исключаем интеграционные с маркой @pytest.mark.integration)
    - name: Run unit tests with coverage
      run: |
        pytest -m "not integration" --cov=llm_agent tests/

    # Генерация SVG бейджика покрытия (для Пункта 7)
    - name: Generate coverage badge
      run: |
        coverage-badge -f -o coverage.svg

    # Сохранение обновленного бейджика в репозиторий
    - name: Commit coverage badge
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add coverage.svg
        git commit -m "chore: update coverage badge [skip ci]" || exit 0
        git push
